[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "veritas"
version = "0.0.1"
description = "A self-updating repository containing claims verified by fact-checking organizations."
readme = "README.md"
dependencies = [
    "pydantic~=2.7.1",
    "requests>=2.28.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.9",
]
 
[project.optional-dependencies]
dev = [
    "ruff",
    "mypy",
    "pytest",
    "pytest-cov"
]

[tool.setuptools]
packages = ["veritas"]

[tool.black]
line-length = 110
target-version = [
    "py311",
]

[tool.ruff]
lint.select = ["E", "F", "W", "I", "N", "UP"]

# Same as Black
line-length = 110

# The lowest supported version
target-version = "py311"

# GitLab CI code quality report
output-format = "grouped"

[tool.ruff.lint.pep8-naming]
ignore-names = [
    "setUp",
    "tearDown",
    "i",
    "j",
    "k",
    "ex",
    "Run",
    "_",
    "up",
    "x",
    "y",
    "z",
    "Jf"
]

[tool.pytest.ini_options]
junit_family = "xunit2"
pythonpath = [
    "veritas",
    "tests"
]

[tool.coverage.run]
concurrency = ["multiprocessing"]
branch = true

[tool.coverage.report]
fail_under = 95.00
precision = 2
show_missing = true
exclude_lines = [
    # Regexes for lines to exclude from consideration

    # Have to re-enable the standard pragma
    "pragma: no cover",

    # Don't complain about missing debug-only code:
    "def __repr__",

    # Don't complain if tests don't hit defensive assertion code:
    "raise AssertionError",
    "raise NotImplementedError",

    # Don't complain if non-runnable code isn't run:
    "if __name__ == .__main__.:",

    # It's okay to not cover unimplemented comparison methods
    "return NotImplemented"
]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
strict_equality = true
show_error_codes = true
plugins = [
    "numpy.typing.mypy_plugin"
]

[[tool.mypy.overrides]]
module = [
    "requests.*",
]
ignore_missing_imports = true