# Pipeline stage configuration. Each stage can be enabled/disabled and
# receives its parameters as keyword arguments to its `run_loop`.
pipeline:
  stage_1:
    enabled: True
    interval_seconds: 86400  # 60 * 60 * 24 (1 day)

  stage_2:
    enabled: True

  stage_3:
    enabled: True
    start: [ 2020, 1 ]
    end: [ 2026, 1 ]
    batch_size: 1000

  stage_4:
    enabled: True
    start: [ 2020, 1 ]
    end: [ 2026, 1 ]
    batch_size: 10000

  stage_5:
    enabled: True
    start: [ 2020, 1 ]
    end: [ 2026, 1 ]
    max_per_quarter: 3500

  stage_6:
    enabled: True
    start: [ 2020, 1 ]
    end: [ 2026, 1 ]
    max_verdicts_per_quarter: 2500
    max_intact_claims_per_quarter: 550

  stage_7:
    enabled: True
    start: [ 2020, 1 ]
    end: [ 2026, 1 ]
    max_per_quarter: 550

  global:
    min_scraped_article_length: 2000  # characters of raw page content
    min_extracted_article_length: 1000  # characters of extracted article content
    max_extracted_article_length: 40_000  # characters of extracted article content
    max_appearances_per_claim: 2  # Successfully scraped appearances used for claim normalization
    max_media_per_claim: 4
    max_video_size: 128_000_000  # Bytes
    max_video_duration: 300  # Seconds
    n_frames_per_video: 5
    sufficient_agreements_threshold: 1  # Maximum allowed difference between any two predictor ratings

# Gold Evidence Reconstruction & Temporal Analysis (veritas/gold_evidence).
# Runs separately from the 7-stage benchmark pipeline above.
gold_evidence:
  # Models. "auto" -> gemini_strong for articles with videos, gpt_strong otherwise
  # (extraction); gpt_strong (filtering); gpt_nano (dating).
  extraction_model: "auto"
  filtering_model: "auto"
  dating_model: "auto"

  # Sufficiency ensemble. Null -> use the global VeriTaS ensemble singleton.
  # Members should come from different model families.
  ensemble_models:
  #  - "openai:gpt-5"
  #  - "anthropic:claude-sonnet-4-5-20250929"
  #  - "gemini:gemini-2.5-pro"
  #  - "selfhosted:meta-llama/Llama-4-Maverick-17B-128E-Instruct-FP8"

  # 'integrity' -> one ensemble call per claim and condition (default).
  # 'full'      -> the whole stage-6 property cascade, 4-6x the calls.
  ensemble_mode: "integrity"
  min_ensemble_ratings: 3

  # Reasoning effort, scaled with task complexity. Null omits the parameter.
  reasoning_effort_extraction: "medium"
  reasoning_effort_dating:
  reasoning_effort_faithfulness: "low"
  reasoning_effort_temporal: "medium"
  reasoning_effort_sufficiency: "high"

  # Thresholds
  proximity_threshold: 0.3      # Max. allowed distance to the gold verdict
  faithfulness_threshold: 0.334 # 1/3 = "entailed (rather uncertain)"
  min_extraction_confidence: 0.0

  # How to treat evidence whose source has no determinable publication time:
  # 'tool_only' (default) | 'permissive' | 'strict'
  undated_policy: "tool_only"

  # Budgets
  max_evidence_per_claim: 20
  max_reviews_per_claim: 2
  max_source_content_length: 30_000
  max_article_length: 50_000
  concurrency: 20
  max_video_size:  # Null -> inherit pipeline.global.max_video_size

  # Reconstruction run (scripts/gold_evidence/run_reconstruction.py). The script
  # has no CLI - edit these keys to change what a run processes.
  reconstruction:
    start:  # [ YEAR, QUARTER ], e.g. [ 2024, 1 ]. Null -> no lower bound
    end:  # [ YEAR, QUARTER ]. Null -> no upper bound (inclusive)
    limit: 100  # Maximum number of claims to process
    batch_size: 25  # Claims fetched and processed per batch
    claim_ids:  # e.g. [ 1234, 5678 ]. Processes exactly these, ignoring the date range
    include_unreleased: False  # Do not prioritize released claims
    redo: False  # Process claims regardless of their current status
    re_extract: False  # Re-run Stage 1 even if evidence is already stored
    re_filter: False  # Re-run Stage 2 for evidence that was already filtered
    skip_sufficiency: False  # Run Stages 1-2 only (useful to pre-fill the evidence table)
    dry_run: False  # Only report which claims would be processed
    log_level: "INFO"

api_secrets:
  openai:
  google:
  anthropic:
  serper:

database:
  database:
  user:
  password:
  host:
  port: 5432

selfhosted:
  url:
  key:

proxy:

ezmm_path:

# For backups with Nextcloud
nextcloud:
  url:
  user:
  password:   # Custom app password, not user PW
  backup_dir:
