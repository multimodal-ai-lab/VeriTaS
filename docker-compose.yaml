services:
  db:
    image: postgres
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: veritas_db
    volumes:
      - pgdata:/var/lib/postgresql

  # Read-only web UI for the Gold Evidence Reconstruction results.
  #   docker compose up webui   ->   http://localhost:8080
  # Override the defaults in a `.env` file next to this one; see webui/README.md.
  webui:
    # Named explicitly so the image can also be built outside compose, e.g. with
    # `podman build -t veritas-webui:latest -f webui/Dockerfile .`, and then
    # started with `docker compose up -d --no-build webui`.
    image: veritas-webui:latest
    build:
      context: .
      dockerfile: webui/Dockerfile
    restart: unless-stopped
    ports:
      # Mapped to itself, so the port is the same inside and outside the
      # container and `WEBUI_PORT` means one thing everywhere. `WEBUI_BIND`
      # selects the host interface: set it to 127.0.0.1 when the UI is served
      # publicly over TLS (below), so that plain HTTP stays local.
      - "${WEBUI_BIND:-0.0.0.0}:${WEBUI_PORT:-8080}:${WEBUI_PORT:-8080}"
    environment:
      # The port uvicorn binds. Also honoured where there is no port mapping,
      # see docker-compose.podman.yaml.
      WEBUI_PORT: ${WEBUI_PORT:-8080}
      # Defaults point at the database on the Docker host, which is where the
      # pipeline usually runs. `config.yaml` fills in anything left unset.
      VERITAS_DB_HOST: ${VERITAS_DB_HOST:-host.docker.internal}
      VERITAS_DB_PORT: ${VERITAS_DB_PORT:-5432}
      VERITAS_DB_NAME: ${VERITAS_DB_NAME:-}
      VERITAS_DB_USER: ${VERITAS_DB_USER:-}
      VERITAS_DB_PASSWORD: ${VERITAS_DB_PASSWORD:-}
      # Where the ezMM media registry is mounted inside the container.
      EZMM_PATH: /media
    volumes:
      # Read-only: the UI reads the database credentials from here and never
      # writes. Keep it read-only so the secrets in it cannot be modified.
      - ./config.yaml:/app/config.yaml:ro
      # The ezMM item registry (item_registry.db plus the image/ and video/
      # directories). Without it the UI works but cannot render any media.
      - ${EZMM_HOST_PATH:-./ezmm}:/media:ro
    extra_hosts:
      # Lets `host.docker.internal` resolve on Linux, too.
      - "host.docker.internal:host-gateway"

  # Optional TLS front: serves the web UI publicly over HTTPS under WEBUI_DOMAIN,
  # with a certificate Caddy obtains and renews from Let's Encrypt. Off unless
  # `.env` sets `COMPOSE_PROFILES=tls` (and `WEBUI_DOMAIN`); see webui/README.md.
  webui-tls:
    image: caddy:2
    profiles: [ "tls" ]
    restart: unless-stopped
    depends_on:
      - webui
    ports:
      - "80:80"      # ACME HTTP challenge, and the redirect to HTTPS
      - "443:443"
      - "443:443/udp"  # HTTP/3
    environment:
      WEBUI_DOMAIN: ${WEBUI_DOMAIN:-}
      # The web UI as seen from this container.
      WEBUI_UPSTREAM: ${WEBUI_UPSTREAM:-webui:${WEBUI_PORT:-8080}}
    volumes:
      - ./webui/Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates and ACME account; kept so a restart does not request new ones.
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  caddy_data:
  caddy_config:
