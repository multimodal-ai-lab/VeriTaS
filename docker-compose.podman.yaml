# Override for rootless podman hosts. Use it together with the base file:
#
#   docker compose -f docker-compose.yaml -f docker-compose.podman.yaml \
#       up -d --no-build webui
#
# Two things do not work there. `host.docker.internal` is a Docker invention
# that podman 3 does not provide, and a PostgreSQL bound to the host's
# 127.0.0.1 is unreachable from any bridge network regardless of the name used.
# Sharing the host's network namespace solves both - and skips CNI entirely,
# which is the other thing that tends to be broken on such hosts.
#
# The UI is then served on the host's port directly. `WEBUI_PORT` still selects
# it: with no port mapping left to apply, the server binds it itself (see the
# Dockerfile), so the variable means the same thing in both setups.
services:
  webui:
    network_mode: host
    ports: !reset []
    extra_hosts: !reset []
    environment:
      # The host's own loopback, which is where the pipeline's database lives.
      VERITAS_DB_HOST: ${VERITAS_DB_HOST:-127.0.0.1}
      # Bound by the server itself here, since nothing maps it - and so is the
      # interface: `WEBUI_BIND=127.0.0.1` keeps plain HTTP local, as on Docker.
      WEBUI_PORT: ${WEBUI_PORT:-8080}
      WEBUI_HOST: ${WEBUI_BIND:-0.0.0.0}

  # The TLS front shares the host's network, too: it reaches the UI on the host's
  # loopback and binds 80/443 itself. Rootless podman may only bind ports below
  # 1024 once `net.ipv4.ip_unprivileged_port_start` is lowered to 80.
  webui-tls:
    network_mode: host
    ports: !reset []
    environment:
      WEBUI_UPSTREAM: ${WEBUI_UPSTREAM:-127.0.0.1:${WEBUI_PORT:-8080}}
